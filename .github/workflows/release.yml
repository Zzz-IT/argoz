name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            asset: argoz-amd64
          - arch: arm64
            asset: argoz-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: go test
        run: go test ./... -count=1

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X argoz/internal/config.Version=${{ github.ref_name }}" \
            -o ${{ matrix.asset }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum argoz-amd64 argoz-arm64 > checksums.txt
          cat checksums.txt

      - name: release notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          # 优先精确匹配 `## [<tag>]`；找不到时回退到 `## [Unreleased]`，
          # 避免版本号忘了落 CHANGELOG 时 release notes 变成空的默认文案。
          extract() {
            awk -v tag="$1" '
              $0 ~ ("^## \\[" tag "\\]") { f = 1; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md
          }
          extract "$TAG" > notes.md
          if [ ! -s notes.md ]; then
            extract "Unreleased" > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Release ${{ github.ref_name }}" > notes.md
          fi
          echo "---- notes ----"
          cat notes.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/argoz-amd64
            dist/argoz-arm64
            dist/checksums.txt
          fail_on_unmatched_files: true
          make_latest: true
